name: math_learning_app
description: "A digital Kumon-style daily math learning app for kids with handwriting recognition."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Crypto
  crypto: ^3.0.3

  # Navigation
  go_router: ^14.2.7

  # Backend & Database
  supabase_flutter: ^2.6.0

  # Local Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Handwriting Recognition
  google_mlkit_digital_ink_recognition: ^0.12.0

  # Video Player
  video_player: ^2.9.1
  chewie: ^1.8.5

  # Charts & Graphs
  fl_chart: ^0.68.0

  # Games Engine
  flame: ^1.19.0

  # Payments & Subscriptions
  purchases_flutter: ^8.1.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.2
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  
  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Analytics & Crash Reporting (optional, can add later)
  # firebase_core: ^3.3.0
  # firebase_analytics: ^11.2.1
  # firebase_crashlytics: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  freezed: ^2.5.7

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true  # For localization

  # Assets can be added later
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/

  # Custom fonts can be added later by placing font files in assets/fonts/
  # fonts:
  #   - family: Nunito
  #     fonts:
  #       - asset: assets/fonts/Nunito-Regular.ttf
  #       - asset: assets/fonts/Nunito-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Nunito-SemiBold.ttf
  #         weight: 600

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
